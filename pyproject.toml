[project]
name = "eu-ai-act-rag"
version = "1.0.0"
description = "Production-grade RAG system answering EU AI Act questions with cited references."
readme = "README_EU_AI_RAG.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies installable anywhere (no CUDA / torch). These are enough to
# import the API, run the offline unit tests, and talk to remote services.
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Retrieval (clients only — heavy models live in the `ml` extra)
    # Floor at 1.18: with `>=1.12` uv split the resolution by interpreter
    # (1.18.0 for py<3.13, 1.12.1 for py>=3.13). The GPU venv is py3.13, so
    # `uv sync --extra ml` silently downgraded it to 1.12.1, whose
    # CreateCollection model rejects the `strict_mode_config` / `metadata` keys
    # that 1.18 writes into data/qdrant/meta.json — every /answer 500'd on
    # retrieval while /health stayed green.
    "qdrant-client>=1.18.0",
    # Cache
    "redis>=5.2.0",
    # LLM client (OpenAI-compatible, talks to SGLang)
    "openai>=1.50.0",
    # Ingestion
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "httpx>=0.27.0",
    # Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    # Utilities
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Embedding, reranking, lexical and graph retrieval. Pulls torch — install on a
# GPU compute node via SLURM, never on the login node.
ml = [
    "bm25s[full]>=0.2.0",
    "PyStemmer>=2.2.0",
    "lightrag-hku>=1.0.0",
    "FlagEmbedding>=1.3.0",
    "sentence-transformers>=3.3.0",
    # FlagEmbedding declares transformers with no upper bound; transformers>=4.50
    # breaks the bge-reranker slow tokenizer path with
    # "XLMRobertaTokenizer has no attribute prepare_for_model" (HTTP 500 at rerank).
    # Pin to the last known-good band for FlagEmbedding 1.4 (>=4.47 keeps Python
    # 3.13 support on the .venv-gpu; <4.49 stays before the breaking change).
    "transformers>=4.47,<4.49",
]
# LLM inference server. GPU-only, CUDA 12.x. Install on the A100 node.
# `gpu` pulls sglang[all] incl. flashinfer (needs the flashinfer wheel index;
# matches the guide's full setup). `gpu-native` is core sglang only — installs
# from plain cu124 PyPI wheels and runs with the Triton attention backend, which
# is what works on this node's 12.4 driver without the flashinfer index.
gpu = [
    "sglang[all]>=0.4.0",
]
gpu-native = [
    "sglang>=0.4.0",
]
# Test/alternate corpus from the Hugging Face Hub (login-node safe; no torch).
data = [
    "pyarrow>=17.0.0",
    "huggingface-hub>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.uv]
# Resolve the dev group by default; ml/gpu extras are opt-in per environment.
default-groups = ["dev"]

# `ml` and `gpu` are never installed into the same environment: `ml` (embedder +
# reranker) runs on the API node, `gpu` (sglang) only on a dedicated inference
# node. Declaring them conflicting makes uv resolve each independently. Without
# it uv must satisfy both at once, and sglang's numpy<2 cap dragged
# qdrant-client down to 1.12.1 on py3.13 — which cannot read an index written
# by 1.18 (see the qdrant-client pin above).
conflicts = [[{ extra = "ml" }, { extra = "gpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the full running stack (SGLang + Qdrant + Redis + API)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The system prompt embeds a verbatim JSON example that must stay on one line.
"src/generation/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
